services:
  xui-remote:
    build: .
    # 面板只监听 127.0.0.1，容器里够不到宿主机的回环地址，所以用 host 网络。
    # 若面板本身也在 Docker 里，删掉这行、把两者接进同一个 network 更好。
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config.yaml:/etc/xui-remote/config.yaml:ro
      - xui-remote-state:/state

volumes:
  xui-remote-state:
