panel:
  # 到 API 组为止。面板的 webBasePath 若是 /panel/，而 API 路由组是 /panel/api，
  # 拼起来 panel 会出现两次。用 `x-ui settings` 查自己的 webBasePath。
  #
  # 跑在面板本机上：用 127.0.0.1，机器通常解析不了自己的 tailnet 域名。
  base_url: "http://127.0.0.1:2053/panel/panel/api/"
  # 跑在同一 tailnet 的其他机器上，改用 tailscale serve 的地址（真证书，无需跳过校验）：
  # base_url: "https://<host>.<tailnet>.ts.net/panel/panel/api/"

  # 面板 → 设置 → 安全 → API 令牌 → 新建令牌。只填名称，scope 留空即默认 admin。
  # 明文只显示一次，库里存的是 SHA-256 哈希。
  api_token: ""

  # 覆盖 Host 头，让生成的分享链接带上客户端够得着的地址。
  # 面板已为每个入站配好 host 条目时留空即可。
  public_host: ""

  timeout_seconds: 20
  # 面板自带自签证书时才需要打开；tailscale serve 给的是真证书。
  insecure_skip_verify: false

telegram:
  # @BotFather → /newbot。别和面板自带 tgbot 共用一个 token：
  # 两个进程对同一 token 做 long polling 会互相抢 update。
  token: ""

  # 必填。空列表拒绝启动 —— admin token 等于面板完整控制权。
  # 填你的用户 ID（正数，私聊时即聊天 ID）。想在群里用，再加上群 ID（负数）：
  # 群 ID 只决定 Bot 在哪个群里响应，群里只有同样列在这里的成员才能操作。
  allowed_chat_ids:
    - 0

state:
  # 暂存区和配置快照。留空即 ~/.xui-remote；systemd 下由 HOME 决定。
  dir: ""
  max_snapshots: 20

apply:
  # 提交后的确认期（分钟）：期限内没点「保留改动」就自动回滚到提交前的配置。
  # 改动把你自己的连接弄断时，什么都不用做就会恢复。0 表示关闭。
  confirm_minutes: 5
